    <circle cx="145" cy="170" r="5"/>
    <circle cx="215" cy="165" r="7"/>
    <circle cx="285" cy="165" r="7"/>
    <circle cx="355" cy="170" r="5"/>
    <circle cx="120" cy="230" r="4"/>
    <circle cx="170" cy="220" r="6"/>
    <circle cx="230" cy="220" r="8.5"/>
    <circle cx="270" cy="220" r="8.5"/>
    <circle cx="330" cy="220" r="6"/>
    <circle cx="380" cy="230" r="4"/>
    <circle cx="135" cy="290" r="5"/>
    <circle cx="195" cy="280" r="6"/>
    <circle cx="250" cy="270" r="5.5"/>
    <circle cx="305" cy="280" r="6"/>
    <circle cx="365" cy="290" r="5"/>
    <circle cx="160" cy="340" r="4"/>
    <circle cx="220" cy="335" r="5.5"/>
    <circle cx="250" cy="330" r="4"/>
    <circle cx="280" cy="335" r="5.5"/>
    <circle cx="340" cy="340" r="4"/>
    <circle cx="195" cy="380" r="4"/>
