  <circle cx="270" cy="220" r="4" fill="#8B5CF6" opacity="0.85"/>
  <circle cx="250" cy="90"  r="3" fill="#4F8CFF" opacity="0.6"/>
  <circle cx="250" cy="390" r="3" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="250" cy="270" r="3" fill="#4F8CFF" opacity="0.5"/>
