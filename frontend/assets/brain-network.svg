    <line x1="380" y1="230" x2="365" y2="290"/>
    <line x1="330" y1="220" x2="365" y2="290"/>
    <line x1="135" y1="290" x2="160" y2="340"/>
    <line x1="195" y1="280" x2="220" y2="335"/>
    <line x1="305" y1="280" x2="280" y2="335"/>
    <line x1="365" y1="290" x2="340" y2="340"/>
    <line x1="160" y1="340" x2="220" y2="335"/>
    <line x1="280" y1="335" x2="340" y2="340"/>
    <line x1="220" y1="335" x2="250" y2="390"/>
    <line x1="280" y1="335" x2="250" y2="390"/>
    <line x1="220" y1="335" x2="195" y2="380"/>
    <line x1="280" y1="335" x2="305" y2="380"/>
    <line x1="195" y1="380" x2="250" y2="390"/>
    <line x1="305" y1="380" x2="250" y2="390"/>
    <line x1="250" y1="270" x2="195" y2="280"/>
    <line x1="250" y1="270" x2="305" y2="280"/>
    <line x1="250" y1="270" x2="250" y2="330"/>
    <line x1="195" y1="280" x2="160" y2="340"/>
