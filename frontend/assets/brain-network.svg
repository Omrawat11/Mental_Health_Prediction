    <line x1="250" y1="90"  x2="310" y2="120"/>
    <line x1="190" y1="120" x2="145" y2="170"/>
    <line x1="190" y1="120" x2="215" y2="165"/>
    <line x1="310" y1="120" x2="355" y2="170"/>
    <line x1="310" y1="120" x2="285" y2="165"/>
    <line x1="215" y1="165" x2="285" y2="165"/>
    <line x1="215" y1="165" x2="230" y2="220"/>
    <line x1="285" y1="165" x2="270" y2="220"/>
    <line x1="145" y1="170" x2="120" y2="230"/>
    <line x1="145" y1="170" x2="170" y2="220"/>
    <line x1="355" y1="170" x2="380" y2="230"/>
    <line x1="355" y1="170" x2="330" y2="220"/>
    <line x1="170" y1="220" x2="230" y2="220"/>
    <line x1="330" y1="220" x2="270" y2="220"/>
    <line x1="230" y1="220" x2="270" y2="220"/>
    <line x1="230" y1="220" x2="195" y2="280"/>
    <line x1="270" y1="220" x2="305" y2="280"/>
    <line x1="230" y1="220" x2="250" y2="270"/>
    <line x1="270" y1="220" x2="250" y2="270"/>
